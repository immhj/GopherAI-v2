[mainConfig]
appName = "GopherAI"
host = "0.0.0.0"
port = 9090

[emailConfig]
authcode = "your authcode "
email = "your qq email"

[redisConfig]
host = "127.0.0.1"
port = 6379
password = ""
db = 0

[mysqlConfig]
host = "127.0.0.1"
port = 3306
user = "root"
password = "123456"
databaseName = "GopherAI"
charset =  "utf8mb4"

[jwtConfig]
 expire_duration= 8760
 issuer= "huanheart"
 subject= "GopherAI"
 key= "GopherAI-v1"

 [rabbitmqConfig]
  host= "rabbitmq"
  port= 5672
  username= "root"
  password= "123456"
  vhost= "/"

 [modelServiceConfig]
  # OpenAI 兼容网关（Aether 反代）
  baseUrl = "http://localhost:8085/v1"
  defaultModel = "claude-opus-5"
  models = ["claude-opus-5", "gpt-5.6-sol"]

  [qdrantConfig]
  url = "http://localhost:6333"
  collection = "documents"

  [embeddingConfig]
  baseUrl = "https://ark.cn-beijing.volces.com/api/v3"
  model = "doubao-embedding-vision-250615"
  dimensions = 1024
  concurrency = 5

  [ragConfig]
  chunkSize = 700
  chunkOverlap = 100
  topK = 5
  scoreThreshold = 0.3

  [searchConfig]
  baseUrl = "https://api.tavily.com"
  maxResults = 5

  [fetchConfig]
  maxBytes = 2000000
  timeoutSeconds = 15
  maxChars = 8000
  allowPrivate = false
