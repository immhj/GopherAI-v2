services:
  # ---------------------------------------------------------------
  # MySQL database (tables are auto-migrated by the backend on start)
  # ---------------------------------------------------------------
  mysql:
    image: mysql:8.0
    container_name: gopherai-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: "123456"
      MYSQL_DATABASE: "GopherAI"
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    ports:
      - "13306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p123456"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - gopherai

  # ---------------------------------------------------------------
  # phpMyAdmin - MySQL visual admin panel
  # URL:  http://localhost:8081   (login user: root / pass: 123456)
  # ---------------------------------------------------------------
  phpmyadmin:
    image: phpmyadmin:5
    container_name: gopherai-phpmyadmin
    restart: unless-stopped
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
      UPLOAD_LIMIT: 256M
    ports:
      - "8081:80"
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - gopherai

  # ---------------------------------------------------------------
  # Redis Stack (includes RediSearch, required for the RAG vector index)
  # 6379 -> Redis  |  8001 -> RedisInsight web UI
  # ---------------------------------------------------------------
  redis:
    image: redis/redis-stack:latest
    container_name: gopherai-redis
    restart: unless-stopped
    ports:
      - "16379:6379"
      - "8001:8001"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - gopherai

  # ---------------------------------------------------------------
  # RabbitMQ (message queue) + management UI on 15672
  # ---------------------------------------------------------------
  rabbitmq:
    image: rabbitmq:3.13-management
    container_name: gopherai-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: "root"
      RABBITMQ_DEFAULT_PASS: "123456"
      RABBITMQ_DEFAULT_VHOST: "/"
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 15s
      timeout: 10s
      retries: 10
    networks:
      - gopherai

  # ---------------------------------------------------------------
  # Go backend API (Gin) on :9090
  # ---------------------------------------------------------------
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: gopherai-backend
    restart: unless-stopped
    environment:
      GIN_MODE: release
      TZ: Asia/Shanghai
      # 聊天模型网关（Aether 反代）的鉴权 key，供 OpenAI 兼容客户端使用
      ANTHROPIC_API_KEY: "${ANTHROPIC_API_KEY:-}"
      # RAG embedding 凭证（DashScope），可选
      OPENAI_API_KEY: "${OPENAI_API_KEY:-}"
      OPENAI_MODEL_NAME: "${OPENAI_MODEL_NAME:-qwen-turbo}"
      OPENAI_BASE_URL: "${OPENAI_BASE_URL:-https://dashscope.aliyuncs.com/compatible-mode/v1}"
    extra_hosts:
      # 让容器内可用 host.docker.internal 访问宿主机上的 Aether 网关
      - "host.docker.internal:host-gateway"
    ports:
      - "9090:9090"
    volumes:
      # Override baked config with container-network hostnames
      - ./config/config.docker.toml:/app/config/config.toml:ro
      # Persist RAG uploads
      - backend-uploads:/app/uploads
      - backend-docs:/app/docs
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - gopherai

  # ---------------------------------------------------------------
  # Vue frontend served by nginx on :8080 (proxies /api -> backend)
  # ---------------------------------------------------------------
  frontend:
    build:
      context: ./vue-frontend
      dockerfile: Dockerfile
    container_name: gopherai-frontend
    restart: unless-stopped
    ports:
      - "8090:80"
    depends_on:
      - backend
    networks:
      - gopherai

networks:
  gopherai:
    driver: bridge

volumes:
  mysql-data:
  redis-data:
  rabbitmq-data:
  backend-uploads:
  backend-docs:
